name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
    steps:
      # The release PR is made with GITHUB_TOKEN, so other workflows (ci.yml)
      # do not run on it. It changes only the version and CHANGELOG.md.
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Tags made with GITHUB_TOKEN do not start other workflows,
  # so the publish job lives here.
  publish:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - name: Check NPM_TOKEN
        if: ${{ env.NODE_AUTH_TOKEN == '' }}
        run: echo "::warning::NPM_TOKEN is not set. Skip npm publish. The git tag and GitHub release are done."
      - uses: actions/checkout@v4
        if: ${{ env.NODE_AUTH_TOKEN != '' }}
      - uses: actions/setup-node@v4
        if: ${{ env.NODE_AUTH_TOKEN != '' }}
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
      # npm ci runs `prepare`, which builds dist/.
      - run: npm ci
        if: ${{ env.NODE_AUTH_TOKEN != '' }}
      - run: npm run lint
        if: ${{ env.NODE_AUTH_TOKEN != '' }}
      - run: npm test
        if: ${{ env.NODE_AUTH_TOKEN != '' }}
      - run: npm publish --provenance --access public
        if: ${{ env.NODE_AUTH_TOKEN != '' }}
